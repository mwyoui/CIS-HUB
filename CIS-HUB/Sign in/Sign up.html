<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/HTML/CIS-HUB/Sign in/Sign in.css">
    <title>User Sign Up - CIS HUB</title>
</head>
<body>
    <header>
        <img src="/HTML/CIS-HUB/images/CISFinalpt2.png" alt="ArtsyTech" >
        <h1>CIS Hub - User Sign Up</h1>
    </header>
    <section class="form-container">
        <form >
            <div class="form-group">
                <label for="first-name">First Name:</label>
                <input type="text" id="first-name" name="first-name" required>
            </div>
            <div class="form-group">
                <label for="last-name">Last Name:</label>
                <input type="text" id="last-name" name="last-name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="id-number">ID Number:</label>
                <input type="text" id="id-number" name="id-number" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </div>
            <div class="role-buttons"><button type="submit"><a href="/HTML/CIS-HUB/Homepage/Homepage.html" style="text-decoration: none;">Sign Up</a></button></div>
            <p>Already have an account? <a href="/HTML/CIS-HUB/Sign in.html" style="color:#a9002dec">Login here</a></p>
        </form>
    </section>
</body>
</html>
