<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CIS HUB</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background: url("/HTML/CIS-HUB/images/CIS building.jpg") no-repeat center center fixed;
    background-size: cover;
    position: relative;
    margin: 0;
    padding: 0;
    min-height: 100vh;
}

/* Add a blurred overlay to the background */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: inherit;
    background-attachment: fixed;
    filter: blur(5px);
    z-index: -1;
}

/* Add a semi-transparent overlay */
body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(255, 255, 255, 0.3);
    z-index: -1;
}

header {
    text-align: center;
    margin: 20px 0;
    padding: 10px;
}

header img {
    display: inline;
    width: 200px;
    /* Make the logo blend with the background by adding a subtle shadow */
    filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.7));
    /* Alternative: add a subtle glow effect */
    /* filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.6)); */
}

header h1 {
    color: #333;
    text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.8);
    margin-top: 10px;
}

.form-container {
    max-width: 400px;
    margin: 0 auto;
    padding: 20px;
    background-color: rgba(255, 255, 255, 0.9);
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: 500;
    color: #444;
}

.form-group input {
    width: 90%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    transition: border-color 0.3s;
}

.form-group input:focus {
    border-color: #a9002d;
    outline: none;
    box-shadow: 0 0 5px rgba(169, 0, 45, 0.3);
}

.role-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 20px 0;
}

.role-buttons button {
    width: 100%;
    padding: 10px;
    background-color: #a9002dec;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s, transform 0.1s;
}

.role-buttons button:hover {
    background-color: #90002d;
    transform: translateY(-2px);
}

.role-buttons button:active {
    transform: translateY(1px);
}

p {
    text-align: center;
    margin-top: 20px;
}

a {
    color: white;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}
    <style>
</head>
<body>
    <header>
        <img src="/HTML/CIS-HUB/images/CISFinalpt2.png" alt="ArtsyTech">
        <h1>CIS Hub - Sign In</h1>
    </header>
    <section class="form-container">
        <form method="GET">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </div>

            <div class="role-buttons">
                <button type="submit" formaction="/HTML/CIS-HUB/1-Admin/Homepage_admin.html">Sign In as Admin</button>
                <button type="submit" formaction="/HTML/CIS-HUB/2-CIS Student/Homepage.html">Sign In as Student</button>
                <button type="submit" formaction="/HTML/CIS-HUB/3-Moderator/Homepage.html">Sign In as Moderator</button>
                <button type="submit" formaction="/HTML/CIS-HUB/4- Department Officer/Homepage.html">Sign In as Department Officer</button>
            </div>
            <p>Don't have an account? <a href="/HTML/CIS-HUB/Sign in/Sign up.html" style="color:#a9002dec">Sign up here</a></p>
        </form>
    </section>
</body>
</html>
